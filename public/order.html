<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Honeydees | Track Orders</title>
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>body { background-color: #faf8f5; font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="p-4 sm:p-8 flex justify-center items-center min-h-screen">
  
  <div class="max-w-md w-full bg-white rounded-3xl border shadow-xl p-6 space-y-5">
    <div class="flex justify-between items-center border-b pb-3">
      <a href="/" class="text-xs font-bold text-slate-500 hover:text-slate-900">← Back to Menu</a>
      <span class="text-xs font-bold text-[#c59b27]">Live Order Tracker</span>
    </div>
    
    <!-- NOTIFICATION PERMISSION PROMPT -->
    <div id="notifyPrompt" class="hidden p-3 bg-amber-50 border border-amber-200 rounded-xl text-center text-xs space-y-1">
      <p class="font-bold text-amber-900">🔔 Enable lockscreen ready alerts?</p>
      <button onclick="requestAlerts()" class="px-3 py-1 bg-amber-600 text-white rounded-lg font-bold text-[11px]">Enable Notifications</button>
    </div>

    <div id="readyBanner" class="hidden p-4 bg-emerald-50 border-2 border-emerald-500 rounded-2xl text-center animate-pulse">
      <span class="text-2xl">🎉</span>
      <h3 class="font-extrabold text-emerald-900 text-sm">YOUR ORDER IS READY!</h3>
      <p class="text-xs text-emerald-700">Please collect at <strong>14 Viola Street, Lentegeur</strong>.</p>
    </div>
    
    <div id="oCont" class="space-y-6"></div>
  </div>

  <script>
    let cS = {};

    function checkNotify() {
      if ("Notification" in window && Notification.permission === "default") {
        document.getElementById("notifyPrompt").classList.remove("hidden");
      }
    }

    async function requestAlerts() {
      if ("Notification" in window) {
        const p = await Notification.requestPermission();
        if (p === "granted") {
          document.getElementById("notifyPrompt").classList.add("hidden");
        }
      }
    }

    function triggerNativeNotification(title, body) {
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      if ("Notification" in window && Notification.permission === "granted") {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification(title, {
              body,
              icon: "https://via.placeholder.com/192x192.png?text=H",
              badge: "https://via.placeholder.com/192x192.png?text=H"
            });
          });
        }
      }
    }

    async function loadOrders() {
      let ts = JSON.parse(localStorage.getItem("hd_tokens") || "[]");
      let q = new URLSearchParams(window.location.search).get("track");
      
      if (q && !ts.find(x => x.token === q)) {
        ts.push({ token: q });
      }
      
      if (!ts.length) {
        document.getElementById("oCont").innerHTML = `
          <div class="text-center py-6">
            <p class="text-xs text-slate-400 mb-3">No active orders found.</p>
            <a href="/" class="px-4 py-2 bg-slate-900 text-white font-bold rounded-xl text-xs">Browse Menu</a>
          </div>`;
        return;
      }

      let activeTokens = [];
      let html = "";

      for (let t of ts) {
        try {
          const r = await fetch(`/api/data?track=${t.token}`);
          if (r.ok) {
            const d = await r.json();
            
            // Trigger Phone Alert if changed to READY
            if (d.status === 'READY' && cS[d.trackingToken] !== 'READY') {
              document.getElementById("readyBanner").classList.remove("hidden");
              triggerNativeNotification("Honeydees Order Ready!", `Your order #${d.orderNumber} is freshly packed!`);
            }
            cS[d.trackingToken] = d.status;

            // Only keep in customer active list if not COMPLETED or CANCELLED
            if (d.status !== 'COMPLETED' && d.status !== 'CANCELLED') {
              activeTokens.push(t);
              const pillClass = d.status === 'READY' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800';
              
              html += `
                <div class="p-4 border border-stone-200 rounded-2xl shadow-sm bg-stone-50">
                  <div class="flex justify-between items-center border-b pb-2 mb-2">
                    <h2 class="text-lg font-black font-mono text-slate-900">${d.orderNumber}</h2>
                    <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase ${pillClass}">${d.status}</span>
                  </div>
                  <div class="text-xs text-slate-700 space-y-1">
                    <div class="flex justify-between"><span>Type:</span><strong>${d.orderType}</strong></div>
                    ${d.orderType === 'DELIVERY' ? `<div class="flex justify-between"><span>Addr:</span><strong>${d.deliveryAddress}</strong></div>` : ''}
                    <div class="flex justify-between mt-2 pt-2 border-t font-bold"><span>Total:</span><strong class="font-mono text-sm text-slate-900">R ${Number(d.total).toFixed(2)}</strong></div>
                  </div>
                </div>`;
            }
          }
        } catch (e) { console.error(e); }
      }

      // Auto-wipes completed orders from customer phone memory
      localStorage.setItem("hd_tokens", JSON.stringify(activeTokens));
      
      if (!activeTokens.length) {
        html = `
          <div class="text-center py-6">
            <p class="text-xs text-slate-400 mb-3">All your orders have been completed!</p>
            <a href="/" class="px-4 py-2 bg-slate-900 text-white font-bold rounded-xl text-xs">Order Again</a>
          </div>`;
      }
      
      document.getElementById("oCont").innerHTML = html;
    }

    window.addEventListener("DOMContentLoaded", () => {
      checkNotify();
      loadOrders();
      setInterval(loadOrders, 10000);
    });
  </script>
</body>
</html>
