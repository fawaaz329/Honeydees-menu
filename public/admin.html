<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Honeydees Admin</title><link rel="manifest" href="/manifest.json"><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>body{background-color:#faf8f5;font-family:'Plus Jakarta Sans',sans-serif}</style></head><body class="min-h-screen flex flex-col justify-between text-slate-800"><div id="popModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4"><div class="bg-white max-w-lg w-full rounded-2xl shadow-2xl p-4 flex flex-col max-h-[90vh]"><div class="flex justify-between items-center border-b pb-2 mb-4"><h3 class="font-bold">POP</h3><button onclick="document.getElementById('popModal').classList.add('hidden')" class="text-xl font-bold text-slate-400">×</button></div><div class="flex-grow overflow-y-auto flex items-center justify-center bg-stone-100 rounded-xl"><iframe id="popFrame" src="" class="w-full h-[60vh] rounded-xl border-none"></iframe></div></div></div><div id="newOrderAlert" class="hidden sticky top-0 z-50 bg-emerald-600 text-white p-3 text-center text-xs font-bold shadow-lg animate-bounce">🔔 NEW ORDER!</div><div id="loginGate" class="my-auto py-16"><div class="max-w-sm mx-auto bg-white p-8 rounded-3xl border shadow-xl text-center space-y-4"><div class="w-12 h-12 bg-[#c59b27] text-white rounded-2xl mx-auto flex items-center justify-center font-bold text-xl">H</div><h2 class="text-xl font-bold">Admin</h2><input type="password" id="passInput" placeholder="Password" class="w-full p-3 border rounded-xl text-xs bg-slate-50 outline-none" onkeydown="if(event.key==='Enter')loginAdmin()"><button onclick="loginAdmin()" class="w-full py-3 bg-slate-900 text-white font-bold rounded-xl text-xs shadow">Unlock</button></div></div><div id="adminApp" class="hidden flex-grow flex flex-col"><nav class="bg-white border-b sticky top-0 z-40"><div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center"><a href="/" class="font-bold text-sm flex items-center gap-2"><span class="w-7 h-7 rounded-lg bg-[#c59b27] text-white flex items-center justify-center">H</span> Admin</a><div class="flex gap-2 items-center"><span class="text-[11px] text-emerald-600 font-bold flex gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Live</span><button onclick="location.reload()" class="px-3 py-1 bg-rose-50 text-rose-700 rounded-lg text-[10px] font-bold">Logout</button></div></div></nav><main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full space-y-5"><div class="flex gap-2 border-b pb-2 overflow-x-auto scrollbar-hide"><button onclick="sTab('tO')" id="bO" class="px-4 py-1.5 bg-slate-900 text-white rounded-xl text-xs font-bold whitespace-nowrap">📦 Active</button><button onclick="sTab('tC')" id="bC" class="px-4 py-1.5 bg-white border rounded-xl text-xs font-bold whitespace-nowrap">✅ Completed</button><button onclick="sTab('tM')" id="bM" class="px-4 py-1.5 bg-white border rounded-xl text-xs font-bold whitespace-nowrap">🍽️ Menu</button><button onclick="sTab('tCat')" id="bCat" class="px-4 py-1.5 bg-white border rounded-xl text-xs font-bold whitespace-nowrap">🏷️ Categories</button><button onclick="sTab('tS')" id="bS" class="px-4 py-1.5 bg-white border rounded-xl text-xs font-bold whitespace-nowrap">⚙️ Settings</button></div><div id="tO" class="space-y-4"><div class="bg-white p-4 rounded-2xl border flex justify-between shadow-sm"><span class="text-xs font-bold text-slate-500">Today's Sales</span><span id="tSales" class="text-xl font-black text-emerald-600">R 0.00</span></div><div id="oList" class="space-y-3"></div></div><div id="tC" class="hidden space-y-4"><div class="flex justify-between items-center"><h3 class="font-bold text-sm">Archived</h3><div class="flex gap-2"><button onclick="exPDF()" class="px-3 py-1.5 bg-slate-800 text-white rounded-lg text-xs font-bold">PDF</button><button onclick="clrComp()" class="px-3 py-1.5 bg-rose-600 text-white rounded-lg text-xs font-bold">Clear All</button></div></div><div id="cList" class="space-y-6"></div></div><div id="tM" class="hidden space-y-4"><div class="flex justify-between"><h3 class="font-bold text-sm">Menu</h3><button onclick="oMod()" class="px-3.5 py-1.5 bg-[#c59b27] text-white rounded-xl text-xs font-bold">+ Add</button></div><div id="mList" class="space-y-6"></div></div><div id="tCat" class="hidden bg-white p-5 rounded-2xl border space-y-4 text-xs"><div class="flex justify-between border-b pb-2"><h3 class="font-bold text-sm">Categories</h3><button onclick="addCat()" class="px-3.5 py-1.5 bg-slate-900 text-white font-bold rounded-xl">+ New</button></div><div id="catList" class="space-y-2"></div></div><div id="tS" class="hidden bg-white p-5 rounded-2xl border space-y-4 text-xs"><h3 class="font-bold text-sm border-b pb-2">Headings</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="font-bold">Store Name</label><input type="text" id="s1" class="w-full p-2 border rounded-xl mt-1 font-bold"></div><div><label class="font-bold">Halal Badge</label><input type="text" id="s2" class="w-full p-2 border rounded-xl mt-1"></div><div><label class="font-bold">Hero Title</label><input type="text" id="s3" class="w-full p-2 border rounded-xl mt-1 font-bold"></div><div><label class="font-bold">Hero Subtitle</label><input type="text" id="s4" class="w-full p-2 border rounded-xl mt-1"></div><div class="sm:col-span-2"><label class="font-bold">Schedule Banner</label><input type="text" id="s5" class="w-full p-2 border rounded-xl mt-1 font-bold"></div></div><h3 class="font-bold text-sm border-b pb-2 pt-2">EFT & Delivery</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="font-bold">Address</label><input type="text" id="s6" class="w-full p-2 border rounded-xl mt-1"></div><div><label class="font-bold">Delivery Fee</label><input type="number" id="s7" class="w-full p-2 border rounded-xl mt-1"></div><div><label class="font-bold">Bank</label><input type="text" id="s8" class="w-full p-2 border rounded-xl mt-1"></div><div><label class="font-bold">Holder</label><input type="text" id="s9" class="w-full p-2 border rounded-xl mt-1"></div><div><label class="font-bold">Acc No</label><input type="text" id="s10" class="w-full p-2 border rounded-xl mt-1"></div><div><label class="font-bold">Branch</label><input type="text" id="s11" class="w-full p-2 border rounded-xl mt-1"></div></div><button onclick="saveSet()" class="px-5 py-2.5 bg-slate-900 text-white font-bold rounded-xl">Save</button></div></main></div><div id="iMod" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4"><div class="bg-white max-w-md w-full rounded-2xl shadow-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto text-xs"><div class="flex justify-between"><h3 class="font-bold text-sm">Add Item</h3><button onclick="cMod()" class="text-xl font-bold">×</button></div><form onsubmit="saveItem(event)" class="space-y-3"><div><label class="font-bold block">Name</label><input type="text" id="i1" required class="w-full p-2 border rounded-xl"></div><div><label class="font-bold block">Category</label><select id="i2" class="w-full p-2 border rounded-xl"></select></div><div><label class="font-bold block">Price</label><input type="number" id="i3" required class="w-full p-2 border rounded-xl"></div><div><label class="font-bold block">Desc</label><textarea id="i4" rows="2" class="w-full p-2 border rounded-xl"></textarea></div><div><label class="font-bold block">Photo</label><input type="file" id="i5" accept="image/*" class="w-full p-1.5 border rounded-xl"></div><div><input type="checkbox" id="i6"><label class="font-bold"> Popular</label></div><button type="submit" id="sIBtn" class="w-full py-2.5 bg-[#c59b27] text-white font-bold rounded-xl">Save</button></form></div></div><script>let aP="",aD={orders:[],public:{}},pO=0;function fP(p){let c=String(p||'').replace(/[^0-9]/g,'');if(c.startsWith('0'))c='27'+c.substring(1);else if(!c.startsWith('27')&&c.length===9)c='27'+c;return c}if("Notification" in window&&Notification.permission!=="granted"&&Notification.permission!=="denied")Notification.requestPermission();async function loginAdmin(){const p=document.getElementById("passInput").value.trim(),r=await fetch("/api/data",{headers:{"Authorization":p}}),j=await r.json();if(r.ok&&j.authenticated){aP=p;aD=j;pO=(j.orders||[]).length;document.getElementById("loginGate").classList.add("hidden");document.getElementById("adminApp").classList.remove("hidden");renderAll();renderGrp();renderCat();loadSet();setInterval(autoCheck,15000)}else alert("Incorrect.")}async function autoCheck(){if(!aP)return;const r=await fetch("/api/data",{headers:{"Authorization":aP}}),j=await r.json();if(r.ok&&j.orders){if(j.orders.length>pO){playCh();if(Notification.permission==="granted")new Notification("Admin",{body:"New order!",icon:"https://via.placeholder.com/192x192.png"});document.getElementById("newOrderAlert").classList.remove("hidden");setTimeout(()=>document.getElementById("newOrderAlert").classList.add("hidden"),5000)}pO=j.orders.length;aD.orders=j.orders;renderAll()}}function playCh(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="sine";o.frequency.setValueAtTime(587.33,c.currentTime);o.frequency.setValueAtTime(880,c.currentTime+0.15);g.gain.setValueAtTime(0.3,c.currentTime);g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.4);o.start();o.stop(c.currentTime+0.4)}catch(e){}}function sP(b){document.getElementById('popFrame').src=b;document.getElementById('popModal').classList.remove('hidden');document.getElementById('popModal').classList.add('flex')}function renderAll(){let aH="",cG={},tS=0,tD=new Date().toLocaleDateString("en-GB");aD.orders.forEach(o=>{const d=o.createdAt.split(" ")[0];if(d===tD&&o.status!=="CANCELLED")tS+=Number(o.total);if(o.status==="COMPLETED"){if(!cG[d])cG[d]=[];cG[d].push(o)}else aH+=genC(o)});document.getElementById("tSales").innerText=`R ${tS.toFixed(2)}`;document.getElementById("oList").innerHTML=aH||"<p class='text-slate-400'>No active orders.</p>";let cH="";for(const d in cG){cH+=`<h4 class="font-bold border-b pb-1 mt-4 mb-2">${d}</h4>`;cG[d].forEach(o=>cH+=genC(o))}document.getElementById("cList").innerHTML=cH||"<p class='text-slate-400'>No completed orders.</p>"}function genC(o){const p=fP(o.customer.phone),m=encodeURIComponent(`Assalāmu ʿalaykum ${o.customer.name}!\nYour Honeydees order #${o.orderNumber} is READY FOR COLLECTION!`),bP=o.status==='PREPARING'?'bg-amber-500 text-white shadow':'bg-slate-100 hover:bg-slate-200',bR=o.status==='READY'?'bg-emerald-600 text-white shadow':'bg-slate-100 hover:bg-emerald-100';return`<div class="p-4 bg-white rounded-2xl border space-y-2 text-xs shadow-sm"><div class="flex justify-between"><strong class="font-mono text-[#9e7914]">${o.orderNumber}</strong><span class="px-2.5 py-0.5 rounded-full font-bold uppercase ${o.status==='READY'?'bg-emerald-100 text-emerald-800':'bg-amber-100 text-amber-800'}">${o.status}</span></div><div><strong>${o.customer.name}</strong> (${o.customer.phone}) • ${o.orderType} ${o.deliveryAddress?o.deliveryAddress:''}</div><div class="border-t pt-1 space-y-1">${o.items.map(i=>`<div class="flex justify-between"><span>${i.quantity}x ${i.name}</span><span>R ${Number(i.lineTotal).toFixed(2)}</span></div>`).join('')}<div class="flex justify-between font-black border-t pt-1"><span>Total</span><span>R ${Number(o.total).toFixed(2)}</span></div></div>${o.popBase64?`<button onclick="sP('${o.popBase64}')" class="text-[#9e7914] font-bold underline"><i class="fa-solid fa-receipt"></i> View POP</button>`:'<span class="text-rose-600">No POP</span>'}<div class="flex flex-wrap gap-2 pt-2 items-center">${o.status!=='COMPLETED'?`<button onclick="uS('${o.id}','PREPARING')" class="px-2.5 py-1.5 rounded-lg font-bold transition ${bP}">Preparing</button><button onclick="uS('${o.id}','READY')" class="px-2.5 py-1.5 rounded-lg font-bold transition ${bR}">Ready</button><button onclick="uS('${o.id}','COMPLETED')" class="px-2.5 py-1.5 bg-slate-900 text-white rounded-lg font-bold shadow">Complete</button><a href="https://wa.me/${p}?text=${m}" target="_blank" class="ml-auto px-3 py-1.5 bg-[#25d366] text-white rounded-lg font-bold shadow"><i class="fa-brands fa-whatsapp"></i> Notify</a>`:'<span class="text-slate-400 font-bold"><i class="fa-solid fa-check"></i> Archived</span>'}</div></div>`}async function uS(id,st){await fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json","Authorization":aP},body:JSON.stringify({action:"updateOrderStatus",data:{orderId:id,status:st}})});const r=await fetch("/api/data",{headers:{"Authorization":aP}});aD=await r.json();renderAll()}async function clrComp(){if(!confirm("Delete all COMPLETED orders?"))return;await fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json","Authorization":aP},body:JSON.stringify({action:"clearCompletedOrders"})});const r=await fetch("/api/data",{headers:{"Authorization":aP}});aD=await r.json();renderAll()}function exPDF(){const c=aD.orders.filter(o=>o.status==="COMPLETED");if(!c.length)return alert("No completed orders.");let h=`<table border="1" width="100%" style="border-collapse:collapse;text-align:left;font-family:sans-serif;font-size:12px;"><tr><th>Date</th><th>Order</th><th>Name</th><th>Amount</th></tr>`;c.forEach(o=>h+=`<tr><td>${o.createdAt}</td><td>${o.orderNumber}</td><td>${o.customer.name}</td><td>R ${Number(o.total).toFixed(2)}</td></tr>`);h+=`</table>`;const w=window.open('','','width=800,height=600');w.document.write(`<html><body><h2>Honeydees Ledger</h2>${h}</body></html>`);w.document.close();w.print()}function renderGrp(){const c=document.getElementById("mList"),ct=aD.public?.categories||[],m=aD.public?.menu||[];if(!m.length)return(c.innerHTML="<p>No items.</p>");c.innerHTML=ct.map(cat=>{const i=m.filter(x=>x.categoryId===cat.id);return`<div class="bg-white p-4 rounded-2xl border space-y-3"><h4 class="font-extrabold text-[#9e7914] uppercase">${cat.name} (${i.length})</h4><div class="space-y-2">${i.length?i.map(x=>`<div class="flex justify-between items-center p-2 bg-stone-50 rounded-xl border"><div class="flex items-center gap-3"><img src="${x.imageUrl}" class="w-12 h-12 rounded-lg object-cover"><div><strong class="block">${x.name}</strong><span>R ${x.price}</span></div></div><button onclick="dM('${x.id}')" class="text-rose-600 font-bold px-2 py-1">Del</button></div>`).join(''):'<p>Empty</p>'}</div></div>`}).join('')}function renderCat(){document.getElementById("catList").innerHTML=(aD.public?.categories||[]).map((c,i)=>`<div class="flex justify-between p-3 bg-slate-50 border rounded-xl"><input type="text" value="${c.name}" onchange="aD.public.categories[${i}].name=this.value;sCat();" class="p-1.5 border rounded-lg font-bold flex-grow mr-2"><button onclick="dC('${c.id}')" class="text-rose-600 font-bold px-2">Del</button></div>`).join('')}function addCat(){const n=prompt("New Category:");if(!n)return;aD.public.categories.push({id:"cat_"+Date.now(),name:n.trim()});sCat();renderCat()}function dC(id){if(!confirm("Delete?"))return;aD.public.categories=aD.public.categories.filter(c=>c.id!==id);sCat();renderCat();renderGrp()}function oMod(){document.getElementById("i1").value="";document.getElementById("i3").value="";document.getElementById("i4").value="";document.getElementById("i5").value="";document.getElementById("i2").innerHTML=(aD.public?.categories||[]).map(c=>`<option value="${c.id}">${c.name}</option>`).join('');document.getElementById("iMod").classList.remove("hidden");document.getElementById("iMod").classList.add("flex")}function cMod(){document.getElementById("iMod").classList.add("hidden");document.getElementById("iMod").classList.remove("flex")}async function saveItem(e){e.preventDefault();const b=document.getElementById("sIBtn");b.innerText="Saving...";b.disabled=true;let u="https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=600";const f=document.getElementById("i5").files[0];if(f)u=await new Promise(r=>{const fr=new FileReader();fr.onload=ev=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas"),m=800;let w=i.width,h=i.height;if(w>h&&w>m){h=Math.round(h*m/w);w=m}else if(h>m){w=Math.round(w*m/h);h=m}c.width=w;c.height=h;c.getContext("2d").drawImage(i,0,0,w,h);r(c.toDataURL("image/jpeg",0.75))};i.src=ev.target.result};fr.readAsDataURL(f)});aD.public.menu.push({id:"item_"+Date.now(),name:document.getElementById("i1").value.trim(),price:Number(document.getElementById("i3").value),description:document.getElementById("i4").value.trim(),categoryId:document.getElementById("i2").value,imageUrl:u,featured:document.getElementById("i6").checked,available:true});await sCat();b.innerText="Save";b.disabled=false;cMod();renderGrp()}async function dM(id){if(!confirm("Delete?"))return;aD.public.menu=aD.public.menu.filter(i=>i.id!==id);await sCat();renderGrp()}async function sCat(){await fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json","Authorization":aP},body:JSON.stringify({action:"adminSaveAll",data:{menu:aD.public.menu,categories:aD.public.categories}})})}function loadSet(){const s=aD.public?.settings||{};document.getElementById("s1").value=s.businessName||"Honeydees";document.getElementById("s2").value=s.halalBadge||"";document.getElementById("s3").value=s.heroHeading||"";document.getElementById("s4").value=s.heroSubtitle||"";document.getElementById("s5").value=s.scheduleNotice||"";document.getElementById("s6").value=s.collectionAddress||"";document.getElementById("s7").value=s.deliveryFee||30;document.getElementById("s8").value=s.bankName||"";document.getElementById("s9").value=s.accountHolder||"";document.getElementById("s10").value=s.accountNumber||"";document.getElementById("s11").value=s.branchCode||""}async function saveSet(){const s={businessName:document.getElementById("s1").value,halalBadge:document.getElementById("s2").value,heroHeading:document.getElementById("s3").value,heroSubtitle:document.getElementById("s4").value,scheduleNotice:document.getElementById("s5").value,collectionAddress:document.getElementById("s6").value,deliveryFee:document.getElementById("s7").value,bankName:document.getElementById("s8").value,accountHolder:document.getElementById("s9").value,accountNumber:document.getElementById("s10").value,branchCode:document.getElementById("s11").value};await fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json","Authorization":aP},body:JSON.stringify({action:"adminSaveAll",data:{settings:s}})});alert("Saved!")}function sTab(t){["tO","tC","tM","tCat","tS"].forEach(id=>document.getElementById(id).classList.add("hidden"));document.getElementById(t).classList.remove("hidden");["bO","bC","bM","bCat","bS"].forEach(b=>document.getElementById(b).className="px-4 py-1.5 bg-white border rounded-xl text-xs font-bold text-slate-700 whitespace-nowrap");document.getElementById({tO:"bO",tC:"bC",tM:"bM",tCat:"bCat",tS:"bS"}[t]).className="px-4 py-1.5 bg-slate-900 text-white rounded-xl text-xs font-bold whitespace-nowrap"}</script></body></html>
