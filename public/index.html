<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Honeydees Menu</title><link rel="manifest" href="/manifest.json"><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>:root{--gold:#c59b27;--gold-dark:#9e7914;--ivory:#faf8f5}body{background-color:var(--ivory);font-family:'Plus Jakarta Sans',sans-serif}.serif{font-family:'Playfair Display',serif}</style></head><body class="text-slate-800 min-h-screen flex flex-col justify-between"><div id="activeOrderBanner" class="hidden bg-[#c59b27] text-white px-4 py-2.5 text-xs font-bold shadow flex justify-between items-center sticky top-0 z-50"><div class="flex items-center gap-2"><span class="animate-pulse">📦</span><span id="activeOrderText">Active Order</span></div><a href="/order" id="activeOrderLink" class="bg-slate-900 hover:bg-black text-white px-3 py-1 rounded-lg text-[11px] shadow">View Status →</a></div><nav class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-stone-200"><div class="max-w-6xl mx-auto px-4 py-3.5 flex justify-between items-center"><div class="flex items-center gap-3 cursor-pointer" onclick="location.href='/'"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#c59b27] to-[#9e7914] flex items-center justify-center text-white font-bold text-lg shadow">H</div><div><h1 class="serif text-xl font-bold text-slate-900 leading-tight" id="navBrandName">Honeydees</h1><span class="text-[10px] font-bold tracking-widest text-[#9e7914] uppercase bg-amber-50 px-2 py-0.5 rounded border border-amber-200" id="navHalalBadge">100% Halal</span></div></div><div class="flex items-center gap-2 sm:gap-3"><a href="/order" class="p-2.5 text-slate-600 hover:text-slate-900 text-xs font-bold border rounded-xl bg-white shadow-sm flex items-center gap-1.5"><i class="fa-solid fa-magnifying-glass"></i> <span class="hidden sm:inline">Track</span></a><a href="/admin" class="p-2.5 text-slate-400 hover:text-slate-700 text-xs border rounded-xl bg-white shadow-sm" title="Admin"><i class="fa-solid fa-gear"></i></a><button onclick="toggleCart()" class="px-4 py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl shadow flex items-center gap-2"><i class="fa-solid fa-bag-shopping text-[#c59b27]"></i><span id="cartBadge" class="bg-[#c59b27] text-white px-2 py-0.5 rounded-full text-[10px] font-black">0</span></button></div></div></nav><header class="py-8 px-4 text-center border-b border-stone-200 bg-gradient-to-b from-amber-50/60 to-transparent"><div class="max-w-xl mx-auto space-y-2"><h2 id="heroHeadingEl" class="serif text-3xl font-extrabold text-slate-900">Cape Town's Treat</h2><p id="heroSubtitleEl" class="text-xs text-slate-600">Flame-grilled Masala steak sandwiches...</p><div class="inline-flex items-center gap-2 bg-white px-3.5 py-1.5 rounded-full text-xs font-bold border border-amber-200 shadow-sm text-slate-700 mt-2"><span class="text-[#c59b27]"><i class="fa-solid fa-clock"></i></span><span id="scheduleNoticeEl">Collection: 14 Viola St (6 PM)</span></div></div></header><main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full"><div id="categoryTabs" class="flex gap-2 overflow-x-auto pb-3 scrollbar-hide"></div><div id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-4"></div></main><div id="cartBackdrop" onclick="toggleCart()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden"></div><aside id="cartDrawer" class="fixed top-0 right-0 bottom-0 w-full max-w-md bg-white z-50 shadow-2xl flex flex-col transform translate-x-full transition duration-300"><div class="p-4 border-b flex justify-between items-center bg-stone-50"><h3 class="font-bold text-slate-900 flex items-center gap-2"><i class="fa-solid fa-bag-shopping text-[#c59b27]"></i> Your Order</h3><button onclick="toggleCart()" class="text-slate-400 hover:text-slate-700 text-xl font-bold p-1">×</button></div><div id="cartItemsList" class="p-4 flex-grow overflow-y-auto space-y-3"></div><div class="p-4 border-t bg-stone-50 space-y-3"><div class="flex justify-between items-center text-sm font-bold text-slate-600"><span>Subtotal:</span><span id="cartSubtotal" class="text-slate-900 text-base">R 0.00</span></div><button onclick="openCheckoutModal()" id="checkoutBtn" class="w-full py-3.5 bg-slate-900 text-white font-bold rounded-xl shadow hover:bg-black transition">Checkout →</button></div></aside><div id="checkoutModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4"><div class="bg-white max-w-lg w-full rounded-2xl shadow-2xl p-6 max-h-[90vh] overflow-y-auto space-y-4"><div class="flex justify-between items-center border-b pb-3"><h3 class="serif text-xl font-bold">EFT Payment</h3><button onclick="closeCheckoutModal()" class="text-xl font-bold text-slate-400">×</button></div><form onsubmit="submitOrder(event)" class="space-y-3 text-xs"><div><label class="font-bold block mb-1">Name *</label><input type="text" id="custName" required class="w-full p-2.5 border rounded-xl bg-slate-50 text-xs"></div><div><label class="font-bold block mb-1">WhatsApp *</label><input type="tel" id="custPhone" required class="w-full p-2.5 border rounded-xl bg-slate-50 text-xs"></div><div><label class="font-bold block mb-1">Fulfilment *</label><select id="custOrderType" onchange="toggleDeliveryFields()" class="w-full p-2.5 border rounded-xl bg-white text-xs font-bold"><option value="COLLECTION">Collection</option><option value="DELIVERY">Delivery (+R30)</option></select></div><div id="deliveryBox" class="hidden"><label class="font-bold block mb-1">Address *</label><textarea id="custDeliveryAddress" rows="2" class="w-full p-2.5 border rounded-xl bg-slate-50 text-xs"></textarea></div><div class="p-3.5 bg-amber-50/70 border border-amber-200 rounded-xl space-y-1"><span class="font-bold text-[#9e7914] block text-[11px] uppercase">Bank Details</span><div class="flex justify-between"><span>Bank:</span><strong id="eftBank">Standard Bank</strong></div><div class="flex justify-between"><span>Holder:</span><strong id="eftHolder">Honeydees</strong></div><div class="flex justify-between"><span>Acc:</span><strong id="eftAcc" class="font-mono">12345</strong></div><div class="flex justify-between"><span>Branch:</span><strong id="eftBranch" class="font-mono">051001</strong></div><div class="flex justify-between border-t border-amber-200 pt-1.5 font-bold text-sm"><span>Payable:</span><span id="finalTotalPayable" class="text-[#9e7914]">R 0.00</span></div></div><div class="p-3 bg-rose-50 border-2 border-rose-200 rounded-xl space-y-1.5"><label class="font-bold text-rose-900 block text-xs">Upload POP *</label><input type="file" id="popFile" required accept="image/*,application/pdf" class="w-full p-2 bg-white border border-rose-300 rounded-xl text-xs"></div><button type="submit" id="placeOrderBtn" class="w-full py-3.5 bg-slate-900 text-white font-bold rounded-xl text-xs">Confirm Order →</button></form></div></div><script>let appData={menu:[],categories:[],settings:{}},cart=[],activeCategory="ALL";async function init(){checkActiveOrdersBanner();const res=await fetch("/api/data");appData=(await res.json()).public||{};const s=appData.settings||{};if(s.businessName)document.getElementById("navBrandName").innerText=s.businessName;if(s.halalBadge)document.getElementById("navHalalBadge").innerText=s.halalBadge;if(s.heroHeading)document.getElementById("heroHeadingEl").innerText=s.heroHeading;if(s.heroSubtitle)document.getElementById("heroSubtitleEl").innerText=s.heroSubtitle;if(s.scheduleNotice)document.getElementById("scheduleNoticeEl").innerText=s.scheduleNotice;if(s.bankName)document.getElementById("eftBank").innerText=s.bankName;if(s.accountHolder)document.getElementById("eftHolder").innerText=s.accountHolder;if(s.accountNumber)document.getElementById("eftAcc").innerText=s.accountNumber;if(s.branchCode)document.getElementById("eftBranch").innerText=s.branchCode;renderCategories();renderMenu()}async function checkActiveOrdersBanner(){const t=localStorage.getItem("hd_active_token"),n=localStorage.getItem("hd_active_num");if(t&&n){try{const r=await fetch(`/api/data?track=${t}`);if(r.ok){const d=await r.json();if(d.status==='COMPLETED'||d.status==='CANCELLED'){localStorage.removeItem("hd_active_token");localStorage.removeItem("hd_active_num");return}}}catch(e){}document.getElementById("activeOrderText").innerText=`Active Order #${n}`;document.getElementById("activeOrderLink").href=`/order?track=${t}`;document.getElementById("activeOrderBanner").classList.remove("hidden")}}function renderCategories(){const c=document.getElementById("categoryTabs"),cats=[{id:"ALL",name:"✨ All"},...(appData.categories||[])];c.innerHTML=cats.map(x=>`<button onclick="setCategory('${x.id}')" class="px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${activeCategory===x.id?'bg-slate-900 text-white':'bg-white border text-slate-700'}">${x.name}</button>`).join('')}function setCategory(id){activeCategory=id;renderCategories();renderMenu()}function renderMenu(){const g=document.getElementById("menuGrid"),l=activeCategory==="ALL"?appData.menu:(appData.menu||[]).filter(i=>i.categoryId===activeCategory);if(!l||!l.length)return g.innerHTML=`<div class="col-span-full text-center py-10 text-xs text-slate-400">No items</div>`;g.innerHTML=l.map(i=>`<div class="bg-white rounded-2xl border overflow-hidden shadow-sm flex flex-col"><div class="h-44 relative bg-stone-100"><img src="${i.imageUrl}" class="w-full h-full object-cover">${i.featured?'<span class="absolute top-2 left-2 bg-[#c59b27] text-white text-[10px] font-black uppercase px-2 py-0.5 rounded-full">Popular</span>':''}</div><div class="p-4 space-y-2 flex-grow flex flex-col justify-between"><div><h4 class="font-bold text-sm">${i.name}</h4><p class="text-xs text-slate-500 line-clamp-2">${i.description}</p></div><div class="flex justify-between items-center pt-2 border-t"><span class="text-base font-black">R ${Number(i.price).toFixed(2)}</span><button onclick="addToCart('${i.id}')" class="px-3.5 py-1.5 bg-amber-50 text-[#9e7914] border rounded-xl font-bold text-xs">+ Add</button></div></div></div>`).join('')}function addToCart(id){const i=appData.menu.find(x=>x.id===id),e=cart.find(c=>c.id===id);if(e)e.quantity++;else cart.push({...i,quantity:1});updateCart();toggleCart(true)}function updateCart(){const c=document.getElementById("cartItemsList"),sub=cart.reduce((s,i)=>s+(i.price*i.quantity),0);document.getElementById("cartBadge").innerText=cart.reduce((s,i)=>s+i.quantity,0);document.getElementById("cartSubtotal").innerText=`R ${sub.toFixed(2)}`;if(!cart.length)return c.innerHTML=`<p class="text-center py-10 text-slate-400">Empty</p>`;c.innerHTML=cart.map(i=>`<div class="flex justify-between items-center p-3 bg-stone-50 rounded-xl border text-xs"><div><strong class="block">${i.name}</strong><span class="text-slate-500">R ${i.price} ea</span></div><div class="flex gap-2 bg-white px-2 py-1 border rounded-lg"><button onclick="changeQty('${i.id}',-1)">-</button><span class="font-bold">${i.quantity}</span><button onclick="changeQty('${i.id}',1)">+</button></div></div>`).join('')}function changeQty(id,d){cart.find(c=>c.id===id).quantity+=d;cart=cart.filter(c=>c.quantity>0);updateCart()}function toggleCart(f){const d=document.getElementById("cartDrawer"),b=document.getElementById("cartBackdrop");if(f||d.classList.contains("translate-x-full")){d.classList.remove("translate-x-full");b.classList.remove("hidden")}else{d.classList.add("translate-x-full");b.classList.add("hidden")}}function openCheckoutModal(){if(!cart.length)return;toggleCart(false);const d=document.getElementById("custOrderType").value==="DELIVERY",t=cart.reduce((s,i)=>s+(i.price*i.quantity),0)+(d?(Number(appData.settings?.deliveryFee)||30):0);document.getElementById("finalTotalPayable").innerText=`R ${t.toFixed(2)}`;document.getElementById("checkoutModal").classList.remove("hidden");document.getElementById("checkoutModal").classList.add("flex")}function closeCheckoutModal(){document.getElementById("checkoutModal").classList.add("hidden");document.getElementById("checkoutModal").classList.remove("flex")}function toggleDeliveryFields(){document.getElementById("deliveryBox").classList.toggle("hidden",document.getElementById("custOrderType").value==="DELIVERY");openCheckoutModal()}async function submitOrder(e){e.preventDefault();const f=document.getElementById("popFile").files[0];if(!f)return alert("POP required.");const b=document.getElementById("placeOrderBtn");b.innerText="Placing...";b.disabled=true;const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});try{const r=await fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"createOrder",data:{customer:{name:document.getElementById("custName").value.trim(),phone:document.getElementById("custPhone").value.trim()},orderType:document.getElementById("custOrderType").value,deliveryAddress:document.getElementById("custDeliveryAddress").value.trim(),items:cart,popBase64:b64}})});const d=await r.json();if(r.ok&&d.trackingToken){localStorage.setItem("hd_active_token",d.trackingToken);localStorage.setItem("hd_active_num",d.orderNumber);window.location.href=`/order?track=${d.trackingToken}`}else{alert(d.error||"Failed");b.innerText="Confirm Order";b.disabled=false}}catch(e){alert("Error");b.disabled=false}}window.addEventListener("DOMContentLoaded",init);</script></body></html>
